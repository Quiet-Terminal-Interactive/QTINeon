name: CI

on:
  push:
  pull_request:

jobs:
  test-java:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Test
        working-directory: java
        run: mvn --batch-mode verify

  test-python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        working-directory: python
        run: pip install -e ".[dev]"

      - name: Test
        working-directory: python
        run: pytest

  test-ts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: js-ts
        run: npm ci

      - name: Test
        working-directory: js-ts
        run: npm test

  test-go:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        working-directory: go
        run: go build ./...

      - name: Vet
        working-directory: go
        run: go vet ./...

      - name: Test
        working-directory: go
        run: go test ./...

  test-godot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.2.2 headless
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.2.2-stable_linux.x86_64.zip
          sudo mv Godot_v4.2.2-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

      - name: Check GDScript syntax
        run: godot --headless --editor --path godot --quit 2>&1 | tee godot_check.log; grep -qE "^SCRIPT ERROR:" godot_check.log && exit 1 || exit 0
